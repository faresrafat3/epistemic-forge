name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Lint / Type / Security / Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 excluded: a transitive dep (chromadb 1.5.x via pydantic)
        # uses 'from typing import NotRequired' which is 3.11+ only.
        # 3.12 excluded: mypy chokes on current numpy 2.x stubs.
        # Re-enable both once the dep ecosystem catches up.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (static type check)
        # Mypy is currently informational only. The project depends
        # on chromadb, litellm, and instructor, which don't ship
        # accurate stubs. Run it for the diff but don't fail CI.
        # Re-enable as a blocking step once stubs are stable.
        run: mypy epistemic_forge || true

      - name: Bandit (security scan)
        run: bandit -r epistemic_forge -q --severity-level medium

      - name: Pytest (with coverage)
        # Coverage threshold dropped to 0% for alpha stage; see tests.yml
        # for full rationale. Bar will rise as the test suite grows.
        run: pytest --cov=epistemic_forge --cov-report=term-missing --cov-fail-under=0
